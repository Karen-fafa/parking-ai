const cats=['소화전','교차로 모퉁이','버스 정류소','횡단보도','어린이 보호구역','인도','기타'];const statuses=['접수완료','처리중','처리완료','상담사연결'];const names=['김민지','박준호','이서연'];let page='dashboard',selected=null;
const seed=Array.from({length:24},(_,i)=>({id:'PK-20261027-'+String(24-i).padStart(3,'0'),time:'2026-10-'+(i<16?'27':'26')+' '+String(14-Math.floor(i/6)).padStart(2,'0')+':'+String(52-i*2).padStart(2,'0'),phone:'010-0000-'+String(1000+i),location:['서울시 중구 세종대로 110 앞','서울시 중구 을지로 30 버스정류소','서울시 중구 퇴계로 120 횡단보도','서울시 중구 다산로 40 인근'][i%4],car:i===7?'미확인':(12+i)+'가 '+(3456+i),category:cats[i%7],status:i===7?'상담사연결':statuses[i%3],assignee:i%3===0?'미배정':names[i%3],memo:i%7===6?'건물 주차장 진입로를 가로막고 있습니다.':'보행 및 통행에 불편을 주는 주정차 신고입니다.',sms:i===7?'미전송':'전송완료',logs:[{time:'접수 시각',text:i===7?'차량번호 확인 실패 · 상담사 연결 대기':'AI 필수정보 확인 · 접수 알림문자 전송 시뮬레이션'}]}));let records;try{records=JSON.parse(localStorage.getItem('parking-demo-v1'))||seed}catch{records=seed}let filters={from:'',to:'',status:'',person:'',cat:'',q:''};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('parking-demo-v1',JSON.stringify(records))}function badge(s){return `<span class="badge s${s}">${s}</span>`}function toast(t){$('#toast').textContent=t;$('#toast').className='toast';setTimeout(()=>$('#toast').className='hidden',3000)}function options(a,v,first='전체'){return `<option value="">${first}</option>`+a.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}
function go(p){page=p;render();window.scrollTo(0,0)}function head(k,t,sub,btn=''){return `<div class="top"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p style="margin-bottom:0">${sub}</p></div>${btn}</div>`}function render(){const menus=[['dashboard','▦','대시보드'],['list','☷','접수 내역 조회'],['reportflow','↗','전화신고 프로세스'],['controlflow','⇄','관제 처리 프로세스']];$('#nav').innerHTML=menus.map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${i}　${t}</button>`).join('');$('#app').innerHTML=page==='dashboard'?dashboard():page==='list'?list():page==='detail'?detail():flow(page==='reportflow');}
function table(rs){return `<div class="tablewrap"><table><thead><tr><th>접수번호 / 시간</th><th>신고 위치</th><th>접수 분류</th><th>차량번호</th><th>상태</th><th>처리자</th><th></th></tr></thead><tbody>${rs.length?rs.map(r=>`<tr tabindex="0" onclick="openDetail('${r.id}')" onkeydown="if(event.key==='Enter')openDetail('${r.id}')"><td><div class="id">${r.id}</div><div class="muted">${r.time}</div></td><td>${esc(r.location)}</td><td>${r.category}</td><td>${esc(r.car)}</td><td>${badge(r.status)}</td><td>${esc(r.assignee)}</td><td>↗</td></tr>`).join(''):'<tr><td colspan="7" style="text-align:center;padding:40px">검색 조건에 맞는 접수 내역이 없습니다.</td></tr>'}</tbody></table></div>`}
function dashboard(){const normal=records.filter(r=>r.status!=='상담사연결');let counts=[normal.length,...['처리중','처리완료','상담사연결'].map(s=>records.filter(r=>r.status===s).length)];return head('OPERATIONS OVERVIEW','오늘의 주차 질서를, 한눈에.','전체 보유 데이터 기준 운영 현황 · 기간별 조회는 접수 내역에서 가능합니다.',`<button class="primary" onclick="newReport()">＋ AI 접수 체험</button>`)+`<div class="cards">${['전체 정상 접수','처리중','처리완료','상담사 연결 대기'].map((t,i)=>`<button class="card" onclick="drill('${['normal','처리중','처리완료','상담사연결'][i]}')"><span>${t}　↗</span><strong>${counts[i]}<small style="font-size:13px"> 건</small></strong><small>${i===0?'위치·차량번호 확인 완료':'상세 내역 보기'}</small></button>`).join('')}</div><div class="grid"><section class="panel"><div class="panelhead"><h2>접수 분류별 현황</h2><span class="muted">정상 접수 ${normal.length}건</span></div>${cats.map(c=>{let n=normal.filter(r=>r.category===c).length;return `<div class="barrow"><a href="#" style="color:inherit;text-decoration:none" onclick="drill('','${c}');return false">${c} ↗</a><div class="bar"><i style="width:${n/Math.max(1,...cats.map(x=>normal.filter(r=>r.category===x).length))*100}%"></i></div><b>${n}</b></div>`}).join('')}</section><section class="panel"><div class="panelhead"><h2>AI 전화접수 안내</h2><span class="badge s접수완료">운영 흐름</span></div><h2 style="font-size:25px;margin:25px 0 10px">한 통의 전화가<br>안전한 거리를 만듭니다.</h2><p>발신번호 확인부터 위치·차량번호 수집,<br>접수 알림까지 AI가 안내합니다.</p><div class="notice">필수 정보 미확인 시 상담사에게 연결됩니다.<br>상담사 연결 건은 정상 접수 집계에서 제외됩니다.</div><button style="margin-top:18px" onclick="go('reportflow')">신고 프로세스 확인 →</button></section></div><section class="panel"><div class="panelhead"><h2>최근 접수 내역 <span class="muted"> · 최신 6건</span></h2><button onclick="drill('')">전체 내역 →</button></div>${table(records.slice(0,6))}</section><div class="muted">데모의 전화·문자는 시뮬레이션입니다. 입력·수정 내용은 현재 브라우저에 저장됩니다.</div>`}
function drill(s,c=''){if(c&&!s)s='normal';filters={from:'',to:'',status:s,person:'',cat:c,q:''};go('list')}function filtered(){return records.filter(r=>(!filters.from||r.time.slice(0,10)>=filters.from)&&(!filters.to||r.time.slice(0,10)<=filters.to)&&(!filters.status||(filters.status==='normal'?r.status!=='상담사연결':r.status===filters.status))&&(!filters.person||r.assignee===filters.person)&&(!filters.cat||r.category===filters.cat)&&(!filters.q||[r.id,r.location,r.car,r.phone].some(x=>x.includes(filters.q))))}function list(){let rs=filtered();return head('REPORT MANAGEMENT','접수 내역 조회','신고 내용을 검색하고, 접수부터 처리완료까지 관리하세요.',`<button class="primary" onclick="newReport()">＋ AI 접수 체험</button>`)+`<section class="panel"><form onsubmit="search(event)" class="filters"><label>접수 시작일<input name="from" type="date" value="${filters.from}"></label><label>접수 종료일<input name="to" type="date" value="${filters.to}"></label><label>처리 상태<select name="status">${options(['normal',...statuses],filters.status).replace('>normal<','>전체 정상 접수<')}</select></label><label>처리자<select name="person">${options(['미배정',...names],filters.person)}</select></label><label>접수 분류<select name="cat">${options(cats,filters.cat)}</select></label><label>통합 검색<input name="q" placeholder="위치·차량·연락처·접수번호" value="${esc(filters.q)}"></label><button class="primary">검색</button><button type="button" onclick="drill('')">초기화</button></form><div class="panelhead"><h2>조회 결과 <span style="color:var(--teal)">${rs.length}</span>건</h2><button onclick="downloadCSV()">↓ CSV 다운로드</button></div>${table(rs)}</section>`}function search(e){e.preventDefault();filters=Object.fromEntries(new FormData(e.target));if(filters.from&&filters.to&&filters.from>filters.to){toast('종료일을 시작일 이후로 선택해 주세요.');return}render()}function openDetail(id){selected=id;go('detail')}
function detail(){const r=records.find(x=>x.id===selected);if(!r)return list();return head('REPORT DETAIL','신고 접수 상세',r.id,`<button onclick="go('list')">← 목록으로</button>`)+`<div class="stepstrip">${['접수완료','분류 확인','처리중','처리완료'].map((s,i)=>`<span style="color:${r.status===s?'var(--teal)':'#8a9a97'}">${i+1}　${s} ${i<3?'　 →':''}</span>`).join('')}</div><div class="twocol"><div><section class="panel"><div class="panelhead"><h2>접수 정보</h2>${badge(r.status)}</div><div class="facts">${[['접수 시간',r.time],['민원인 연락처',r.phone],['차량번호',r.car],['문자 알림',r.sms+' (시뮬레이션)'],['발생 위치',r.location],['접수 분류',r.category]].map(([k,v])=>`<div><label>${k}</label><strong>${esc(v)}</strong></div>`).join('')}</div><hr style="border:0;border-top:1px solid var(--line);margin:25px 0"><label>신고 상세 메모</label><div>${esc(r.memo)}</div></section><section class="panel"><h2 style="margin-bottom:20px">처리 이력</h2><div class="timeline">${r.logs.map(l=>`<div class="event"><b>${esc(l.text)}</b><p>${esc(l.time)}</p></div>`).join('')}</div></section></div><section class="panel"><h2>접수 확인 및 처리</h2><p>분류 확인 후 담당자를 지정하고 처리 내용을 남겨주세요.</p><form onsubmit="updateRecord(event)"><label>민원인 연락처<input name="phone" required value="${esc(r.phone==='미확인'?'':r.phone)}"></label><label>발생 위치<input name="location" required value="${esc(r.location)}"></label><label>차량번호<input name="car" required value="${esc(r.car==='미확인'?'':r.car)}"></label><div class="formgrid" style="margin-top:15px"><label>접수 분류<select name="category">${cats.map(c=>`<option ${c===r.category?'selected':''}>${c}</option>`).join('')}</select></label><label>처리자<select name="assignee">${['미배정',...names].map(c=>`<option ${c===r.assignee?'selected':''}>${c}</option>`).join('')}</select></label></div><label style="margin-top:15px">상태<select name="status">${statuses.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></label><label style="margin-top:15px">처리 상세 내역<textarea name="note" placeholder="현장 확인, 이동 요청, 처리 결과 등을 작성하세요."></textarea></label><label style="margin:15px 0;display:flex;gap:8px;align-items:center"><input style="width:auto;margin:0" name="confirmed" type="checkbox">접수 분류 및 필수 정보를 확인했습니다.</label><button class="primary" style="width:100%">처리 내역 저장</button><div class="muted" style="margin-top:12px">처리중·처리완료 전환 시 담당자와 분류 확인이 필요합니다. 처리완료 시 상세 내역을 입력해 주세요.</div></form></section></div>`}
function updateRecord(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),r=records.find(x=>x.id===selected);if(d.status!=='상담사연결'&&(!d.car.trim()||d.car==='미확인'))return toast('차량번호 확인이 필요합니다.');if(['처리중','처리완료'].includes(d.status)&&(!d.confirmed||d.assignee==='미배정'))return toast('분류 확인과 담당자 지정이 필요합니다.');if(d.status==='처리완료'&&!d.note.trim())return toast('처리완료 상세 내역을 입력해 주세요.');if(d.status!=='상담사연결'&&!/^0\d{8,10}$/.test(d.phone.replace(/[-\s]/g,'')))return toast('연락처를 확인해 주세요.');if(d.category==='기타'&&!d.note.trim()&&r.memo==='상세 메모 없음')return toast('기타 상세 정보를 입력해 주세요.');const wasFail=r.status==='상담사연결';Object.assign(r,{phone:d.phone.trim(),location:d.location.trim(),car:d.car.trim(),category:d.category,assignee:d.assignee,status:d.status});r.logs.unshift({time:now(),text:`${d.assignee} · ${d.status}${d.confirmed?' · 분류 확인':''}${d.note?' · '+d.note.trim():''}`});if(wasFail&&d.status!=='상담사연결'){r.sms='전송완료';r.logs.unshift({time:now(),text:'상담사 보완 접수 완료 · 정상 접수 문자 전송 시뮬레이션'})}save();render();toast('처리 내역을 저장했습니다. 대시보드에 반영되었습니다.')}
function now(){return new Date().toLocaleString('sv-SE',{timeZone:'Asia/Seoul'}).slice(0,16)}
function flow(isReport){let nodes=isReport?[['01 · 민원인','신고 전화','불법 주정차 신고 전용번호로 전화'],['02 · AI','발신번호 확인','민원인 연락처 확인 및 저장'],['03 · AI','신고 정보 수집','발생 위치 · 차량번호 확인'],['04 · AI','접수 분류','7개 유형 분류 · 상세 메모 수집'],['05 · 시스템','정상 접수 완료','접수번호 생성 · 문자 알림'],['06 · 관제','담당자 확인','관제 목록 및 상세에 반영']]:[['01 · 시스템','신고 접수','AI 정상 접수 또는 상담사 보완 접수'],['02 · 담당자','접수 분류 확인','발생 위치 · 차량번호 · 유형 검토'],['03 · 담당자','담당자 지정','처리자 배정 및 정보 보완'],['04 · 담당자','처리중','현장 확인 및 조치 내용 기록'],['05 · 담당자','처리완료','처리 결과 필수 작성 · 완료 저장']];return head(isReport?'PROCESS 01 · CITIZEN → AI':'PROCESS 02 · CONTROL CENTER',isReport?'전화신고 · AI 접수 프로세스':'민원 접수 · 관제 처리 프로세스',isReport?'민원인의 신고가 담당자에게 전달되기까지의 전체 흐름':'정상 접수된 민원을 확인하고 처리 결과를 남기는 업무 흐름',`<button class="printbtn" onclick="window.print()">↓ 이 화면 인쇄 / PDF</button>`)+`<div class="flow">${nodes.map(([n,t,d],i)=>`${i?'<div class="arrow">→</div>':''}<div class="node"><div class="num">${n}</div><b>${t}</b><span>${d}</span></div>`).join('')}</div><div class="branch"><section class="panel"><div class="eyebrow">${isReport?'SUCCESS PATH':'PROCESSING RULE'}</div><h2 style="margin-top:8px">${isReport?'필수 정보 확인 → 정상 접수':'분류 확인 → 처리중 → 처리완료'}</h2><p>${isReport?'발생 위치와 차량번호가 모두 확인되면 정상 접수합니다.':'담당자 배정과 분류 확인 후 처리 상태를 변경합니다.'}</p><div class="notice">${isReport?'문자 예시<br>[바른주차] 신고가 정상 접수되었습니다. 접수번호: PK-YYYYMMDD-001 / 발생 위치 및 차량번호가 등록되었습니다.':'처리완료 필수 항목<br>처리자 · 접수 분류 확인 · 처리 결과 상세 내역<br>모든 변경 사항은 처리 이력에 기록합니다.'}</div><button style="margin-top:20px" onclick="${isReport?'newReport()':"drill('접수완료')"}">${isReport?'AI 접수 체험하기':'접수 대기 목록 보기'} →</button></section><section class="panel fail"><div class="eyebrow" style="color:#b57c4f">${isReport?'EXCEPTION PATH':'EXCEPTION & REVIEW'}</div><h2 style="margin-top:8px">${isReport?'정보 확인 실패 → 상담사 연결':'미확인 정보 → 보완 후 처리'}</h2><p>${isReport?'위치·차량번호 미확인, 발신번호 확인 실패 또는 AI 수집 실패 시 상담사에게 연결합니다.':'상담사 연결 건은 정상 접수와 별도 관리합니다.'}</p><div class="notice" style="background:#faf3ec;color:#a07850">${isReport?'AI 수집 정보와 실패 사유 인계 → 상담사 보완<br>보완 완료 시 정상 접수 및 문자 알림<br>미보완 시 상담사연결 상태 유지':'차량번호·위치를 보완하고 정상 접수로 전환합니다.<br>보완 접수 시 문자 알림을 시뮬레이션하며,<br>처리 결과는 민원별 상세 화면에서 확인합니다.'}</div><button style="margin-top:20px" onclick="drill('상담사연결')">상담사 연결 내역 보기 →</button></section></div><section class="panel"><h2 style="margin-bottom:16px">접수 분류 체계</h2><div style="display:flex;gap:12px;flex-wrap:wrap">${cats.map((c,i)=>`<button onclick="drill('','${c}')"><span class="num">0${i+1}</span>　${c}</button>`).join('')}</div><p style="margin:18px 0 0">기타 유형은 상세 메모를 필수로 수집합니다. 실제 단속·행정처분 판정은 담당 기관 업무 기준에 따릅니다.</p></section>`}
function newReport(){$('#modal').className='modal';$('#modal').innerHTML=`<div class="modalbox"><div class="panelhead"><div><div class="eyebrow">AI CALL SIMULATOR</div><h2>전화신고 접수 체험</h2></div><button onclick="closeModal()">✕</button></div><p>AI가 통화에서 수집한 정보를 입력해 접수 흐름을 확인하세요.</p><form onsubmit="submitReport(event)"><div class="formgrid"><label class="full">민원인 연락처<input name="phone" placeholder="010-1234-5678"></label><label class="full">발생 위치<input name="location" placeholder="예: 서울시 중구 세종대로 110 앞"></label><label>차량번호<input name="car" placeholder="예: 12가 3456"></label><label>접수 분류<select name="category">${cats.map(c=>`<option>${c}</option>`).join('')}</select></label><label class="full">신고 상세 메모<textarea name="memo" placeholder="기타 선택 시 상세 내용을 입력해 주세요."></textarea></label><label class="full" style="display:flex;align-items:center;gap:8px"><input type="checkbox" name="failed" style="width:auto">AI 수집 실패 상황 체험</label></div><div class="notice" style="margin:15px 0">위치·차량번호·연락처가 누락되면 상담사 연결로 분류합니다. 실제 전화 연결 및 문자 발송은 하지 않습니다.</div><button class="primary" style="width:100%">접수 결과 확인</button></form></div>`}function closeModal(){$('#modal').className='hidden';$('#modal').innerHTML=''}
function submitReport(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));Object.keys(d).forEach(k=>d[k]=d[k].trim());let reason=[];if(!/^0\d{8,10}$/.test(d.phone.replace(/[-\s]/g,'')))reason.push('연락처 미확인');if(!d.location)reason.push('위치 미확인');if(!d.car)reason.push('차량번호 미확인');if(d.category==='기타'&&!d.memo)reason.push('기타 상세정보 미확인');if(d.failed)reason.push('AI 수집 실패');let fail=reason.length>0;let id='PK-'+now().slice(0,10).replaceAll('-','')+'-'+Date.now().toString().slice(-6);records.unshift({id,time:now(),phone:d.phone||'미확인',location:d.location||'미확인',car:d.car||'미확인',category:d.category,memo:d.memo||'상세 메모 없음',status:fail?'상담사연결':'접수완료',assignee:'미배정',sms:fail?'미전송':'전송완료',logs:[{time:now(),text:fail?'상담사 연결 요청 · '+reason.join(', '):'AI 필수정보 확인 · 정상 접수 문자 전송 시뮬레이션'}]});save();closeModal();openDetail(id);toast(fail?'상담사 연결 대기로 등록되었습니다.':'정상 접수 완료 · 접수 알림문자 전송 시뮬레이션')}
function downloadCSV(){const rows=[['접수번호','접수시간','연락처','발생위치','차량번호','접수분류','상태','처리자','상세메모'],...filtered().map(r=>[r.id,r.time,r.phone,r.location,r.car,r.category,r.status,r.assignee,r.memo])];const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"' $&").replaceAll('"','""')+'"').join(',')).join('\r\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='바른주차_접수내역.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();</script></html>
